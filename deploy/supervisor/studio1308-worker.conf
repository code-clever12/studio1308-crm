; Supervisor config for the Laravel queue worker (notifications, mail, ACH
; payout processing, etc.). Copy to /etc/supervisor/conf.d/ on the
; production server, then:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start studio1308-worker:*
;
; --tries=3 matches the retry policy documented for notification delivery
; in the project spec. --max-time=3600 restarts each worker process hourly
; so it picks up new code after a deploy without needing a manual restart
; (Supervisor immediately respawns it thanks to autorestart=true) — you
; still get faster propagation with `php artisan queue:restart` after
; deploying, see docs/DEPLOYMENT.md.

[program:studio1308-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/studio1308/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/studio1308
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/studio1308/storage/logs/worker.log
stopwaitsecs=3600
