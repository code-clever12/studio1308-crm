name: Tests

# CI only — no deploy step. Deployment for this app is manual (see
# docs/DEPLOYMENT.md); this workflow just makes sure `master` never breaks
# before you pull it onto the server yourself.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, gd, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Copy .env
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Generate app key
        run: php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test --compact
